name: Windows UI Tests

on:
  push:
    branches:
      - main
    paths:
      - gorilla-ui/**
      - '!gorilla-ui/*.md'
      - '!gorilla-ui/**/*.md'
      - cmd/gorilla/**
      - pkg/config/**
      - pkg/service/**
      - integration/windows/**
      - Makefile
      - .github/workflows/windows-ui-test.yml
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  windows-ui-tests:
    name: Windows UI Tests
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Set Git config
        run: git config --global core.autocrlf false

      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Determine whether UI E2E is required
        id: changes
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -ne 'pull_request') {
            'run=true' >> $env:GITHUB_OUTPUT
            exit 0
          }

          $base = '${{ github.event.pull_request.base.sha }}'
          $head = '${{ github.event.pull_request.head.sha }}'
          $files = @(git diff --name-only $base $head)
          $runUi = $false

          foreach ($file in $files) {
            $isUiSource = $file -like 'gorilla-ui/*' -and $file -notmatch '\.md$'
            $isRelevant = $isUiSource -or
              $file -like 'cmd/gorilla/*' -or
              $file -like 'pkg/config/*' -or
              $file -like 'pkg/service/*' -or
              $file -like 'integration/windows/*' -or
              $file -eq 'Makefile' -or
              $file -eq '.github/workflows/windows-ui-test.yml'

            if ($isRelevant) {
              $runUi = $true
              break
            }
          }

          ('run={0}' -f $runUi.ToString().ToLowerInvariant()) >> $env:GITHUB_OUTPUT

      - name: Configure NuGet package path
        if: steps.changes.outputs.run == 'true'
        shell: pwsh
        run: |
          "NUGET_PACKAGES=$env:RUNNER_TEMP\nuget-packages" >> $env:GITHUB_ENV

      - name: Set up .NET
        if: steps.changes.outputs.run == 'true'
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Run FlaUI Windows UI validation
        if: steps.changes.outputs.run == 'true'
        id: ui-e2e
        shell: pwsh
        run: make ui-e2e

      - name: Summarize skipped Windows UI validation
        if: steps.changes.outputs.run != 'true'
        shell: pwsh
        run: |
          @(
            '## Windows UI validation'
            ''
            'UI E2E was not required for the files changed by this pull request.'
          ) | Add-Content -Path $env:GITHUB_STEP_SUMMARY

      - name: Summarize Windows UI evidence
        if: always() && steps.changes.outputs.run == 'true'
        shell: pwsh
        run: |
          try {
            $outcome = '${{ steps.ui-e2e.outcome }}'
            $summary = @(
              '## Windows UI evidence'
              ''
              ('**UI E2E outcome:** {0}  ' -f $outcome)
              '**Artifact:** `windows-ui-evidence`'
              ''
              'Download `windows-ui-evidence` from this workflow run''s **Artifacts** section. Start with:'
              ''
              '1. `healthy/screenshots/` and `service-unavailable/screenshots/` to see what actually rendered.'
              '2. `automation-tree.txt` to inspect the UI Automation hierarchy and exposed state.'
              '3. `tests.trx` to identify failing tests and test context.'
              '4. `ui-client.log` and `gorilla.log` to correlate client/service requests and operations.'
              '5. `process-info.txt` and `service-info.txt` for process, exit, and service state.'
            )
            $summary | Add-Content -Path $env:GITHUB_STEP_SUMMARY
          } catch {
            Write-Warning "Unable to write Windows UI evidence summary: $($_.Exception.Message)"
          }

      - name: Upload Windows UI evidence bundle
        id: upload-evidence
        if: always() && steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: windows-ui-evidence
          path: build/windows-integration/ui-evidence/**
          if-no-files-found: warn

      - name: Link Windows UI evidence from PR
        if: always() && github.event_name == 'pull_request' && steps.changes.outputs.run == 'true'
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          UI_E2E_OUTCOME: ${{ steps.ui-e2e.outcome }}
          EVIDENCE_URL: ${{ steps.upload-evidence.outputs.artifact-url }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          try {
            $marker = '<!-- windows-ui-evidence -->'
            $status = if ($Env:UI_E2E_OUTCOME -eq 'success') { '✅ Passed' } else { '❌ Failed' }
            $artifactLink = if ([string]::IsNullOrWhiteSpace($Env:EVIDENCE_URL)) {
              'Evidence artifact unavailable'
            } else {
              ('[Evidence bundle]({0})' -f $Env:EVIDENCE_URL)
            }

            $body = @(
              $marker
              '### Windows UI evidence'
              ('**{0}** · commit `{1}`' -f $status, '${{ github.event.pull_request.head.sha }}')
              ('{0} · [Workflow run]({1})' -f $artifactLink, $Env:RUN_URL)
              ''
              'Includes screenshots, UI automation tree, TRX results, client/service logs, and process/service metadata.'
            ) -join "`n"

            $headers = @{
              Accept = 'application/vnd.github+json'
              Authorization = "Bearer $Env:GITHUB_TOKEN"
              'X-GitHub-Api-Version' = '2022-11-28'
            }
            $commentsUri = "https://api.github.com/repos/${{ github.repository }}/issues/$Env:PR_NUMBER/comments?per_page=100"
            $comments = @(Invoke-RestMethod -Method Get -Uri $commentsUri -Headers $headers)
            $existing = $comments |
              Where-Object { $_.body -like "*$marker*" -and $_.user.login -eq 'github-actions[bot]' } |
              Select-Object -First 1
            $payload = @{ body = $body } | ConvertTo-Json

            if ($null -ne $existing) {
              $commentUri = "https://api.github.com/repos/${{ github.repository }}/issues/comments/$($existing.id)"
              Invoke-RestMethod -Method Patch -Uri $commentUri -Headers $headers -Body $payload -ContentType 'application/json' | Out-Null
            } else {
              Invoke-RestMethod -Method Post -Uri $commentsUri -Headers $headers -Body $payload -ContentType 'application/json' | Out-Null
            }
          } catch {
            Write-Warning "Unable to update Windows UI evidence PR comment: $($_.Exception.Message)"
          }
