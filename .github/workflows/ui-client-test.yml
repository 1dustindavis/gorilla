name: UI Client Tests

on:
  push:
    branches:
      - main
    paths:
      - gorilla-ui/**
      - '!gorilla-ui/*.md'
      - '!gorilla-ui/**/*.md'
      - Makefile
      - .github/workflows/ui-client-test.yml
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: UI Client Tests
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
    - name: Set Git config
      run: git config --global core.autocrlf false

    - name: Check out code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Configure NuGet package path
      shell: pwsh
      run: |
        $nugetPackages = Join-Path $env:RUNNER_TEMP 'nuget-packages'
        "NUGET_PACKAGES=$nugetPackages" >> $env:GITHUB_ENV

    - name: Set up .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 8.0.x

    - name: Validate portable UI
      run: make ui-lint ui-test
