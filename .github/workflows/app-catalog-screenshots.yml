name: App Catalog Screenshots

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/app-catalog-screenshots.yml'
      - 'integration/windows/app-catalog-screenshots/**'
      - 'gorilla-ui/src/Gorilla.UI.App/**'

permissions:
  contents: read

concurrency:
  group: app-catalog-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Capture App Catalog screenshots
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Configure Git line endings
        shell: pwsh
        run: git config --global core.autocrlf false

      - name: Check out selected ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Configure screenshot display
        shell: powershell
        run: |
          $setCommand = Get-Command Set-DisplayResolution -ErrorAction Stop
          Get-Command Get-DisplayResolution -ErrorAction Stop | Out-Null
          Write-Host "Using Set-DisplayResolution from $($setCommand.Source)"
          Write-Host "Initial display resolution:"
          Get-DisplayResolution | Out-Host

          Set-DisplayResolution -Width 1920 -Height 1080 -Force
          Start-Sleep -Seconds 2

          Write-Host "Configured display resolution:"
          Get-DisplayResolution | Out-Host

          Add-Type -AssemblyName System.Windows.Forms
          $screen = [System.Windows.Forms.Screen]::PrimaryScreen
          if ($null -eq $screen) {
            throw "No primary display is available in the hosted runner session."
          }

          Write-Host "Primary display: $($screen.Bounds.Width)x$($screen.Bounds.Height)"
          Write-Host "Working area: $($screen.WorkingArea.Width)x$($screen.WorkingArea.Height)"

          if ($screen.Bounds.Width -ne 1920 -or $screen.Bounds.Height -ne 1080) {
            throw "Runner display is $($screen.Bounds.Width)x$($screen.Bounds.Height); expected 1920x1080 after Set-DisplayResolution."
          }
          if ($screen.WorkingArea.Width -lt 1280 -or $screen.WorkingArea.Height -lt 800) {
            throw "Runner working area $($screen.WorkingArea.Width)x$($screen.WorkingArea.Height) cannot fit the canonical 1280x800 window."
          }

      - name: Install pinned display-scaling helper
        shell: pwsh
        run: |
          Install-Module -Name DisplayConfig -RequiredVersion 6.0.0 -Scope CurrentUser -Force -AllowClobber
          Import-Module DisplayConfig -RequiredVersion 6.0.0
          Get-Command Set-DisplayScale,Get-DisplayScale -Module DisplayConfig | Format-Table -AutoSize | Out-Host

      - name: Configure Go cache paths
        shell: pwsh
        run: |
          "GOMODCACHE=$env:RUNNER_TEMP\go\pkg\mod" >> $env:GITHUB_ENV
          "GOCACHE=$env:RUNNER_TEMP\go-build" >> $env:GITHUB_ENV

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Configure NuGet package path
        shell: pwsh
        run: '"NUGET_PACKAGES=$env:RUNNER_TEMP\nuget-packages" >> $env:GITHUB_ENV'

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Build branch-matched Gorilla service
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          go build -v -o build/gorilla.exe ./cmd/gorilla
          if ($LASTEXITCODE -ne 0) {
            throw "Gorilla service build failed"
          }

      - name: Build branch-matched unpackaged UI
        shell: pwsh
        run: |
          $project = "gorilla-ui/src/Gorilla.UI.App/Gorilla.UI.App.csproj"
          dotnet restore $project
          if ($LASTEXITCODE -ne 0) {
            throw "Gorilla UI restore failed"
          }
          dotnet build $project `
            -c Release `
            -p:Platform=x64 `
            -p:WindowsPackageType=None `
            -p:WindowsAppSDKSelfContained=true `
            -p:PublishReadyToRun=false `
            -p:PublishTrimmed=false `
            --no-restore
          if ($LASTEXITCODE -ne 0) {
            throw "Gorilla UI build failed"
          }

      - name: Capture baseline control
        shell: pwsh
        run: |
          ./integration/windows/app-catalog-screenshots/capture-app-catalog.ps1 `
            -GorillaExePath "$env:GITHUB_WORKSPACE\build\gorilla.exe" `
            -OutputDirectory "$env:GITHUB_WORKSPACE\build\app-catalog-screenshots\baseline" `
            -EnvironmentName baseline `
            -ExpectedDpi 96

      - name: Capture at 150 percent scaling
        shell: pwsh
        run: |
          Import-Module DisplayConfig -RequiredVersion 6.0.0
          $scalableIds = @()
          foreach ($display in @(Get-DisplayInfo)) {
            try {
              Get-DisplayScale -DisplayId $display.DisplayId -ErrorAction Stop | Out-Null
              $scalableIds += [uint]$display.DisplayId
            } catch {}
          }
          if ($scalableIds.Count -ne 1) {
            throw "Expected exactly one scalable display on the hosted runner; found $($scalableIds -join ',')."
          }
          $displayId = $scalableIds[0]

          DisplayConfig\Set-DisplayResolution -DisplayId $displayId -Width 2560 -Height 1440 -AllowChanges
          Set-DisplayScale -DisplayId $displayId -Scale 150
          Start-Sleep -Seconds 3
          Get-DisplayScale -DisplayId $displayId | Format-List * | Out-Host

          ./integration/windows/app-catalog-screenshots/capture-app-catalog.ps1 `
            -GorillaExePath "$env:GITHUB_WORKSPACE\build\gorilla.exe" `
            -OutputDirectory "$env:GITHUB_WORKSPACE\build\app-catalog-screenshots\scale-150" `
            -EnvironmentName scale-150 `
            -ExpectedDpi 144 `
            -Compact

          Set-DisplayScale -DisplayId $displayId -Scale 100
          DisplayConfig\Set-DisplayResolution -DisplayId $displayId -Width 1920 -Height 1080 -AllowChanges
          Start-Sleep -Seconds 3

      - name: Capture dark mode
        shell: pwsh
        run: |
          ./integration/windows/app-catalog-screenshots/set-presentation-environment.ps1 -Mode Dark
          ./integration/windows/app-catalog-screenshots/capture-app-catalog.ps1 `
            -GorillaExePath "$env:GITHUB_WORKSPACE\build\gorilla.exe" `
            -OutputDirectory "$env:GITHUB_WORKSPACE\build\app-catalog-screenshots\dark" `
            -EnvironmentName dark `
            -ExpectedDpi 96 `
            -Compact
          $manifest = Get-Content "$env:GITHUB_WORKSPACE\build\app-catalog-screenshots\dark\manifest.json" -Raw | ConvertFrom-Json
          if ($manifest.appsUseLightTheme -ne 0 -or $manifest.highContrast) {
            throw "Dark-mode provenance does not match the requested environment."
          }
          ./integration/windows/app-catalog-screenshots/set-presentation-environment.ps1 -Mode Light

      - name: Capture Windows high contrast
        shell: pwsh
        run: |
          ./integration/windows/app-catalog-screenshots/set-presentation-environment.ps1 -Mode HighContrast
          ./integration/windows/app-catalog-screenshots/capture-app-catalog.ps1 `
            -GorillaExePath "$env:GITHUB_WORKSPACE\build\gorilla.exe" `
            -OutputDirectory "$env:GITHUB_WORKSPACE\build\app-catalog-screenshots\high-contrast" `
            -EnvironmentName high-contrast `
            -ExpectedDpi 96 `
            -Compact
          $manifest = Get-Content "$env:GITHUB_WORKSPACE\build\app-catalog-screenshots\high-contrast\manifest.json" -Raw | ConvertFrom-Json
          if (-not $manifest.highContrast) {
            throw "High-contrast provenance does not report high contrast enabled."
          }

      - name: Restore runner presentation settings
        if: always()
        shell: pwsh
        run: |
          try { ./integration/windows/app-catalog-screenshots/set-presentation-environment.ps1 -Mode Light } catch {}
          try {
            Import-Module DisplayConfig -RequiredVersion 6.0.0 -ErrorAction Stop
            $display = @(Get-DisplayInfo | Select-Object -First 1)[0]
            if ($null -ne $display) {
              Set-DisplayScale -DisplayId $display.DisplayId -Scale 100 -ErrorAction SilentlyContinue
              DisplayConfig\Set-DisplayResolution -DisplayId $display.DisplayId -Width 1920 -Height 1080 -AllowChanges -ErrorAction SilentlyContinue
            }
          } catch {}

      - name: Summarize capture
        if: always()
        shell: pwsh
        run: |
          $root = "$env:GITHUB_WORKSPACE\build\app-catalog-screenshots"
          @(
            '## App Catalog screenshots'
            ''
            ('**Ref:** `{0}`  ' -f '${{ github.ref }}')
            ('**Commit:** `{0}`  ' -f '${{ github.sha }}')
            '**Runner display:** 1920 × 1080'
            '**Canonical window:** 1280 × 800'
            ''
            'Expected captures:'
            '- `catalog-default.png`'
            '- `catalog-search.png`'
            '- `catalog-mixed-actions.png`'
            '- `catalog-detail.png`'
            ''
            'The artifact also includes capture provenance and service/UI diagnostics.'
          ) | Add-Content -Path $env:GITHUB_STEP_SUMMARY

          if (Test-Path -LiteralPath (Join-Path $root 'capture-failure.txt')) {
            @('', '### Capture failure', '', 'See `capture-failure.txt` in the artifact.') |
              Add-Content -Path $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload screenshots and provenance
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: app-catalog-screenshots-${{ github.sha }}
          path: build/app-catalog-screenshots/**
          if-no-files-found: warn
          retention-days: 30
