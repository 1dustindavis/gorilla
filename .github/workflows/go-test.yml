name: Go Tests
on:
  push:
    branches:
      - main
    paths:
      - cmd/**
      - pkg/**
      - utils/**
      - integration/**
      - Makefile
      - go.mod
      - go.sum
      - .github/workflows/go-test.yml
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  build:
    name: Go Tests
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
    - name: Set Git config
      run: git config --global core.autocrlf false

    - name: Check out code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Configure Go cache paths
      shell: pwsh
      run: |
        "GOMODCACHE=$env:RUNNER_TEMP\go\pkg\mod" >> $env:GITHUB_ENV
        "GOCACHE=$env:RUNNER_TEMP\go-build" >> $env:GITHUB_ENV

    - name: Set up Go
      uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
      with:
        go-version-file: go.mod
        cache: true
        cache-dependency-path: |
          go.sum
          Makefile
          .github/workflows/go-test.yml

    - name: Lint
      run: make lint

    - name: Test with coverage
      run: make coverage-go

    - name: Add coverage summary
      if: always() && hashFiles('build/coverage/go/summary.txt') != ''
      shell: pwsh
      run: |
        "## Go coverage" | Add-Content $env:GITHUB_STEP_SUMMARY
        "```text" | Add-Content $env:GITHUB_STEP_SUMMARY
        Get-Content build/coverage/go/summary.txt | Add-Content $env:GITHUB_STEP_SUMMARY
        "```" | Add-Content $env:GITHUB_STEP_SUMMARY

    - name: Upload Go coverage
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: go-coverage
        path: build/coverage/go/**
        if-no-files-found: ignore
        retention-days: 14
