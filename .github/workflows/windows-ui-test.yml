name: Windows UI Tests

on:
  push:
    branches:
      - main
    paths:
      - gorilla-ui/**
      - '!gorilla-ui/*.md'
      - '!gorilla-ui/**/*.md'
      - cmd/gorilla/**
      - pkg/config/**
      - pkg/service/**
      - integration/windows/**
      - Makefile
      - .github/workflows/windows-ui-test.yml
  pull_request:
    paths:
      - gorilla-ui/**
      - '!gorilla-ui/*.md'
      - '!gorilla-ui/**/*.md'
      - cmd/gorilla/**
      - pkg/config/**
      - pkg/service/**
      - integration/windows/**
      - Makefile
      - .github/workflows/windows-ui-test.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  windows-ui-tests:
    name: Verify
    runs-on: windows-latest
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Set Git config
        run: git config --global core.autocrlf false

      - name: Check out code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Configure NuGet package path
        shell: pwsh
        run: |
          "NUGET_PACKAGES=$env:RUNNER_TEMP\nuget-packages" >> $env:GITHUB_ENV

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Run FlaUI Windows UI validation
        shell: pwsh
        run: make ui-e2e UI_E2E_MAX_ATTEMPTS=3

      - name: Upload Windows UI test artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: windows-ui-test-results
          path: |
            build/windows-integration/ui-results/**
            build/windows-integration/ui-artifacts/**
