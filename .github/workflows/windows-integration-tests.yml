name: Windows Integration

on:
  workflow_dispatch:
  push:
    paths:
      - cmd/**
      - pkg/**
      - integration/windows/**
      - Makefile
      - go.mod
      - go.sum
      - .github/workflows/windows-integration-tests.yml
  pull_request:

permissions:
  contents: read

jobs:
  integration-tests:
    name: Verify
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Set Git config
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Seed stale fixture sentinel
        shell: pwsh
        run: |
          $toolsDir = "${{ runner.temp }}\gorilla-release-integration\fixture\tools"
          New-Item -Path $toolsDir -ItemType Directory -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $toolsDir "gorilla-it-sideload.cer") -Value "stale fixture sentinel"

      - name: Run Windows integration validation
        shell: pwsh
        env:
          WINDOWS_INTEGRATION_WORK_ROOT: ${{ runner.temp }}\gorilla-release-integration
        run: make windows-integration

      - name: Upload integration failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-integration-failure-${{ github.run_id }}
          path: |
            C:\ProgramData\gorilla-it\cache\gorilla.log
            ${{ runner.temp }}/gorilla-release-integration/fixture/configs
          if-no-files-found: warn
          retention-days: 90
