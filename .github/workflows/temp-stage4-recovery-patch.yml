name: Temporary Stage 4 recovery patch

on:
  push:
    branches:
      - agent/app-catalog-stage4-recovery

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/app-catalog-stage4-recovery
      - name: Apply focused recovery wiring
        shell: pwsh
        run: |
          $clientPath = 'gorilla-ui/src/Gorilla.UI.Client/NamedPipeGorillaServiceClient.cs'
          $client = Get-Content $clientPath -Raw
          $oldClass = 'public sealed class NamedPipeGorillaServiceClient : IGorillaServiceClient'
          $newClass = 'public sealed partial class NamedPipeGorillaServiceClient : IGorillaServiceClient'
          if (-not $client.Contains($oldClass)) { throw 'client class declaration anchor not found' }
          $client = $client.Replace($oldClass, $newClass)
          Set-Content $clientPath $client -NoNewline

          $servicePath = 'pkg/service/run_windows.go'
          $service = Get-Content $servicePath -Raw
          $anchor = @'
          if req.Version != pipeProtocolVersion {
                  result = "error"
                  writeErrorEnvelope(file, req.RequestID, req.Operation, req.OperationID, "unsupported_version", "unsupported protocol version")
                  return
          }

          cmd, err := commandFromRequestEnvelope(req)
          '@
          $replacement = @'
          if req.Version != pipeProtocolVersion {
                  result = "error"
                  writeErrorEnvelope(file, req.RequestID, req.Operation, req.OperationID, "unsupported_version", "unsupported protocol version")
                  return
          }

          // Operation lookup is read directly from the in-memory registry so UI
          // recovery remains available while installer execution holds execMutex.
          if req.Operation == actionListOperations {
                  if err := sr.writeListOperationsResponse(file, req); err != nil {
                          result = "error"
                          gorillalog.Warn("failed to write operation lookup response:", err)
                  } else {
                          result = "ok"
                  }
                  return
          }

          cmd, err := commandFromRequestEnvelope(req)
          '@
          if (-not $service.Contains($anchor)) { throw 'service protocol anchor not found' }
          $service = $service.Replace($anchor, $replacement)
          Set-Content $servicePath $service -NoNewline

          gofmt -w pkg/service/run_windows.go
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add $clientPath $servicePath
          if (-not (git diff --cached --quiet)) {
            git commit -m "Wire in-memory operation lookup through pipe"
            git push origin HEAD:agent/app-catalog-stage4-recovery
          }
