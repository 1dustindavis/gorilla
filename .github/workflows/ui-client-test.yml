name: UI Client Tests

on:
  push:
    branches:
      - main
    paths:
      - gorilla-ui/**
      - '!gorilla-ui/*.md'
      - '!gorilla-ui/**/*.md'
      - Makefile
      - coverage.mk
      - .github/workflows/ui-client-test.yml
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: UI Client Tests
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
    - name: Set Git config
      run: git config --global core.autocrlf false

    - name: Check out code
      uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

    - name: Configure NuGet package path
      shell: pwsh
      run: |
        $nugetPackages = Join-Path $env:RUNNER_TEMP 'nuget-packages'
        "NUGET_PACKAGES=$nugetPackages" >> $env:GITHUB_ENV

    - name: Set up .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 8.0.x

    - name: Validate portable UI with coverage
      run: make -f Makefile -f coverage.mk coverage-ui

    - name: Add coverage summary
      if: always() && hashFiles('build/coverage/ui/**/coverage.cobertura.xml') != ''
      shell: pwsh
      run: |
        "## Portable .NET coverage" | Add-Content $env:GITHUB_STEP_SUMMARY
        "| Project | Line coverage | Branch coverage |" | Add-Content $env:GITHUB_STEP_SUMMARY
        "| --- | ---: | ---: |" | Add-Content $env:GITHUB_STEP_SUMMARY
        Get-ChildItem build/coverage/ui -Recurse -Filter coverage.cobertura.xml | Sort-Object FullName | ForEach-Object {
          [xml]$report = Get-Content $_.FullName
          $project = if ($_.FullName -match '[\\/]client[\\/]') { 'Gorilla.UI.Client' } else { 'Gorilla.UI.Core' }
          $line = '{0:P2}' -f [double]$report.coverage.'line-rate'
          $branch = '{0:P2}' -f [double]$report.coverage.'branch-rate'
          "| $project | $line | $branch |" | Add-Content $env:GITHUB_STEP_SUMMARY
        }

    - name: Upload portable .NET coverage
      if: always()
      uses: actions/upload-artifact@v6
      with:
        name: portable-dotnet-coverage
        path: build/coverage/ui/**
        if-no-files-found: ignore
        retention-days: 14
