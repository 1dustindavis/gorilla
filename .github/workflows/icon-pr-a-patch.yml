name: PR A temporary patch

on:
  push:
    branches:
      - feature/app-catalog-icons-pr-a

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/app-catalog-icons-pr-a
      - name: Patch Windows response wiring
        shell: python
        run: |
          from pathlib import Path
          p = Path('pkg/service/run_windows.go')
          s = p.read_text()
          old = "\t\t\t\tDescription:        item.Description,\n\t\t\t\tVersion:            version,"
          new = "\t\t\t\tDescription:        item.Description,\n\t\t\t\tIconPath:           item.IconPath,\n\t\t\t\tVersion:            version,"
          if old not in s:
              raise SystemExit('expected run_windows response snippet not found')
          p.write_text(s.replace(old, new, 1))
      - name: Commit patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add pkg/service/run_windows.go
          git commit -m "Wire resolved icon path into live response"
          git push
