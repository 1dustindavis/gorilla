name: App Catalog Screenshots

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-catalog-screenshots-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: Capture App Catalog screenshots
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Configure Git line endings
        shell: pwsh
        run: git config --global core.autocrlf false

      - name: Check out selected ref
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Set up WinApp CLI
        uses: microsoft/setup-WinAppCli@b93bbddc1f7abc061ca0d3a8119e3a0c7dd71495 # v0.2

      - name: Inspect screenshot display
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms

          $screen = [System.Windows.Forms.Screen]::PrimaryScreen
          if ($null -eq $screen) {
            throw "No primary display is available in the hosted runner session."
          }

          Write-Host "Primary display: $($screen.Bounds.Width)x$($screen.Bounds.Height)"
          Write-Host "Working area: $($screen.WorkingArea.Width)x$($screen.WorkingArea.Height)"
          Write-Host "The canonical 1280x800 app window may extend beyond the runner desktop; capture uses the WinApp CLI window surface rather than the screen DC."
          winapp --version
          if ($LASTEXITCODE -ne 0) {
            throw "WinApp CLI is not available after setup."
          }

      - name: Configure Go cache paths
        shell: pwsh
        run: |
          "GOMODCACHE=$env:RUNNER_TEMP\go\pkg\mod" >> $env:GITHUB_ENV
          "GOCACHE=$env:RUNNER_TEMP\go-build" >> $env:GITHUB_ENV

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Configure NuGet package path
        shell: pwsh
        run: '"NUGET_PACKAGES=$env:RUNNER_TEMP\nuget-packages" >> $env:GITHUB_ENV'

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x

      - name: Build branch-matched Gorilla service
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build | Out-Null
          go build -v -o build/gorilla.exe ./cmd/gorilla
          if ($LASTEXITCODE -ne 0) {
            throw "Gorilla service build failed"
          }

      - name: Build branch-matched unpackaged UI
        shell: pwsh
        run: |
          $project = "gorilla-ui/src/Gorilla.UI.App/Gorilla.UI.App.csproj"
          dotnet restore $project
          if ($LASTEXITCODE -ne 0) {
            throw "Gorilla UI restore failed"
          }
          dotnet build $project `
            -c Release `
            -p:Platform=x64 `
            -p:WindowsPackageType=None `
            -p:WindowsAppSDKSelfContained=true `
            -p:PublishReadyToRun=false `
            -p:PublishTrimmed=false `
            --no-restore
          if ($LASTEXITCODE -ne 0) {
            throw "Gorilla UI build failed"
          }

      - name: Capture canonical App Catalog screenshots
        shell: pwsh
        run: |
          ./integration/windows/app-catalog-screenshots/capture-app-catalog.ps1 `
            -GorillaExePath "$env:GITHUB_WORKSPACE\build\gorilla.exe" `
            -OutputDirectory "$env:GITHUB_WORKSPACE\build\app-catalog-screenshots"

      - name: Summarize capture
        if: always()
        shell: pwsh
        run: |
          $root = "$env:GITHUB_WORKSPACE\build\app-catalog-screenshots"
          @(
            '## App Catalog screenshots'
            ''
            ('**Ref:** `{0}`  ' -f '${{ github.ref }}')
            ('**Commit:** `{0}`  ' -f '${{ github.sha }}')
            '**Canonical window:** 1280 × 800'
            '**Capture:** WinApp CLI window-surface capture (WGC with PrintWindow fallback)'
            ''
            'Expected captures:'
            '- `catalog-default.png`'
            '- `catalog-search.png`'
            '- `catalog-mixed-actions.png`'
            '- `catalog-detail.png`'
            ''
            'The artifact also includes capture provenance and service/UI diagnostics.'
          ) | Add-Content -Path $env:GITHUB_STEP_SUMMARY

          if (Test-Path -LiteralPath (Join-Path $root 'capture-failure.txt')) {
            @('', '### Capture failure', '', 'See `capture-failure.txt` in the artifact.') |
              Add-Content -Path $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload screenshots and provenance
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: app-catalog-screenshots-${{ github.sha }}
          path: build/app-catalog-screenshots/**
          if-no-files-found: error
          retention-days: 30
