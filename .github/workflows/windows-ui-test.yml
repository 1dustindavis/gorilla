name: Windows UI Tests

on:
  push:
    branches:
      - main
    paths:
      - gorilla-ui/**
      - '!gorilla-ui/*.md'
      - '!gorilla-ui/**/*.md'
      - Makefile
      - .github/workflows/windows-ui-test.yml
  pull_request:
    paths:
      - gorilla-ui/**
      - '!gorilla-ui/*.md'
      - '!gorilla-ui/**/*.md'
      - Makefile
      - .github/workflows/windows-ui-test.yml

permissions:
  contents: read

jobs:
  windows-ui-tests:
    name: Verify
    runs-on: windows-2025
    timeout-minutes: 30
    continue-on-error: true
    steps:
      - name: Set Git config
        run: git config --global core.autocrlf false

      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Run FlaUI Windows UI validation
        shell: pwsh
        run: make ui-e2e UI_E2E_MAX_ATTEMPTS=3

      - name: Upload Windows UI test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-ui-test-results
          path: |
            gorilla-ui/tests/Gorilla.UI.App.WindowsUiTests/TestResults/**
            gorilla-ui/tests/Gorilla.UI.App.WindowsUiTests/artifacts/**
