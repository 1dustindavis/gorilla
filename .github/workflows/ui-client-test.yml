name: UI Client Tests

on:
  push:
    branches:
      - main
    paths:
      - gorilla-ui/**
      - '!gorilla-ui/*.md'
      - '!gorilla-ui/**/*.md'
      - Makefile
      - .github/workflows/ui-client-test.yml
  pull_request:
    paths:
      - gorilla-ui/**
      - '!gorilla-ui/*.md'
      - '!gorilla-ui/**/*.md'
      - Makefile
      - .github/workflows/ui-client-test.yml

permissions:
  contents: read

jobs:
  build:
    name: Verify (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
    - name: Set Git config
      run: git config --global core.autocrlf false

    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: UI lint
      run: make ui-lint

    - name: UI test
      run: make ui-test
